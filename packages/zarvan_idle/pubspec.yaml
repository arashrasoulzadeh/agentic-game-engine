name: zarvan_idle
description: >
  Idle / incremental-game layer on top of zarvan_core/zarvan_flutter:
  generators, upgrades, prestige, achievements and the widgets to show them.
  The genre-general maths and persistence (big numbers, offline progress,
  save versioning) live in zarvan_core; this package is the genre-specific
  assembly, mirroring zarvan_strategy and zarvan_platformer.
version: 0.1.0
homepage: https://github.com/arashrasoulzadeh/zarvan
repository: https://github.com/arashrasoulzadeh/zarvan
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # PrefsSaveStore: one key-value save that works on Android, iOS and web.
  shared_preferences: ^2.3.0
  # Self-referencing git dependencies, same pattern (and same
  # ref-must-match-consumer limitation) as zarvan_strategy — see
  # zarvan_flutter's pubspec.yaml comment.
  zarvan_schema:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_schema
      ref: main
  zarvan_core:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_core
      ref: main
  zarvan_flutter:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_flutter
      ref: main
  zarvan_platformer:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_platformer
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
