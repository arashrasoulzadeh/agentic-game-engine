name: engine_api
description: >
  MCP server and HTTP / JSON-RPC API for the engine. Every studio command, engine function and
  project function is one operation, also available as a CLI command.
version: 0.1.0
publish_to: none
homepage: https://github.com/arashrasoulzadeh/agentic-game-engine
repository: https://github.com/arashrasoulzadeh/agentic-game-engine

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.2
  crypto: ^3.0.3
  # Self-referencing git dependencies, same pattern as engine_cli (see CLAUDE.md):
  # a local path: dependency would make pub see two descriptions of engine_core.
  # pubspec_overrides.yaml restores local resolution for monorepo development only.
  engine_schema:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_schema
      ref: main
  engine_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_core
      ref: main
  image: ^4.7.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

executables:
  engine_api: engine_api
