name: engine_idle
description: >
  Idle / incremental-game layer on top of engine_core/engine_flutter:
  generators, upgrades, prestige, achievements and the widgets to show them.
  The genre-general maths and persistence (big numbers, offline progress,
  save versioning) live in engine_core; this package is the genre-specific
  assembly, mirroring engine_strategy and engine_platformer.
version: 0.1.0
homepage: https://github.com/arashrasoulzadeh/agentic-game-engine
repository: https://github.com/arashrasoulzadeh/agentic-game-engine
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Self-referencing git dependencies, same pattern (and same
  # ref-must-match-consumer limitation) as engine_strategy — see
  # engine_flutter's pubspec.yaml comment.
  engine_schema:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_schema
      ref: main
  engine_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_core
      ref: main
  engine_flutter:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_flutter
      ref: main
  engine_platformer:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_platformer
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
