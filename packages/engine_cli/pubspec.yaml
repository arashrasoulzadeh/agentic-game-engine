name: engine_cli
description: CLI for scaffolding and updating Flutter games built on engine_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  # For `lint --render`: rasterizing a level's TileMap to a PNG so a
  # human (or an agent) can see the level's shape without running the
  # whole game.
  image: ^4.7.0
  # Self-referencing git dependency, same pattern as engine_flutter (see
  # its pubspec.yaml comment) — `game_agent lint` needs Level.validate().
  engine_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_core
      ref: main

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

executables:
  game_agent: game_agent
