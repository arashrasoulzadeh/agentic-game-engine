name: zarvan_cli
description: CLI for scaffolding and updating Flutter games built on zarvan_core.
version: 0.1.0
publish_to: none
homepage: https://github.com/arashrasoulzadeh/zarvan
repository: https://github.com/arashrasoulzadeh/zarvan

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  # For `lint --render`: rasterizing a level's TileMap to a PNG so a
  # human (or an agent) can see the level's shape without running the
  # whole game.
  image: ^4.7.0
  # For parsing pubspec.yaml in build-release command
  yaml: ^3.1.2
  # Self-referencing git dependency, same pattern as zarvan_flutter (see
  # its pubspec.yaml comment) — `zarvan lint` needs Level.validate().
  # Component schemas for `zarvan studio validate`. Pure Dart, so the CLI
  # validates every engine component without importing Flutter.
  zarvan_schema:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_schema
      ref: main
  zarvan_core:
    git:
      url: https://github.com/arashrasoulzadeh/zarvan.git
      path: packages/zarvan_core
      ref: main

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0

executables:
  zarvan: zarvan
