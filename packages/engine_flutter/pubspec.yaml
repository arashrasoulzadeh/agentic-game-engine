name: engine_flutter
description: Flutter rendering/input/camera shell for engine_core. No gameplay logic lives here.
version: 0.1.0
homepage: https://github.com/arashrasoulzadeh/agentic-game-engine
repository: https://github.com/arashrasoulzadeh/agentic-game-engine
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Self-referencing git dependency (not a local `path:`) so the ref
  # string here always matches whatever ref an external consumer pins
  # engine_core to. A local `path:` would make pub see two different
  # engine_core "descriptions" (a resolved commit vs. the consumer's
  # `ref: main`) and refuse to solve — see pubspec_overrides.yaml for
  # local monorepo development.
  #
  # KNOWN LIMITATION: this ref must exactly match whatever ref
  # engine_cli's `--ref` pins a generated project's engine_core/
  # engine_flutter dependencies to, or the same "forbidden" conflict
  # reappears. Since this ref is baked into committed code (not
  # templated per-consumer), the practical rule is: `main` always works;
  # pinning to a tag only works if this file is updated to that same tag
  # (and re-tagged) as part of cutting the release. Moving to pub.dev
  # publishing removes this constraint entirely via normal semver.
  engine_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_core
      ref: v0.1.0
  # For SaveGame: shared_preferences works identically on
  # Android/iOS/web/desktop, unlike raw File I/O (path_provider's File
  # APIs don't work on web at all) — the right cross-platform choice
  # given this engine's Android+iOS+Web target.
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/light_shadow.frag
