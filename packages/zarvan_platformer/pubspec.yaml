name: zarvan_platformer
description: >
  2D-platformer-genre gameplay on top of zarvan_core/zarvan_flutter:
  gravity, jump, tile/platform collision, player and enemy spawn
  helpers, patrol/follow behaviors, facing and movement-driven
  animation. Not general-purpose ECS/rendering — that stays in
  zarvan_core/zarvan_flutter so a non-platformer 2D game (top-down,
  puzzle, etc.) isn't forced to depend on gravity/jump concepts.
version: 0.1.0
homepage: https://github.com/arashrasoulzadeh/agentic-game-engine
repository: https://github.com/arashrasoulzadeh/agentic-game-engine
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Self-referencing git dependencies, same pattern (and same
  # ref-must-match-consumer limitation) as zarvan_flutter's own
  # dependency on zarvan_core — see that pubspec.yaml's comment.
  # Self-referencing git dependency for the component schemas (see
  # zarvan_core/pubspec.yaml).
  zarvan_schema:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/zarvan_schema
      ref: main
  zarvan_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/zarvan_core
      ref: main
  zarvan_flutter:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/zarvan_flutter
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test:
  #   sdk: flutter
  flutter_lints: ^6.0.0
  benchmark_harness: ^2.3.1

flutter:
