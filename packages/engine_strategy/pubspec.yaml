name: engine_strategy
description: >
  Turn-based strategy-genre gameplay on top of engine_core/engine_flutter:
  one-call system wiring, unit spawn helpers, grid navigation, orders,
  combat, fog of war and selection. The data types and rules live in
  engine_core (genre-general); this package is the genre-specific
  assembly, mirroring engine_platformer.
version: 0.1.0
homepage: https://github.com/arashrasoulzadeh/agentic-game-engine
repository: https://github.com/arashrasoulzadeh/agentic-game-engine
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Self-referencing git dependencies, same pattern (and same
  # ref-must-match-consumer limitation) as engine_platformer — see
  # engine_flutter's pubspec.yaml comment.
  engine_schema:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_schema
      ref: main
  engine_core:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_core
      ref: main
  engine_flutter:
    git:
      url: https://github.com/arashrasoulzadeh/agentic-game-engine.git
      path: packages/engine_flutter
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
