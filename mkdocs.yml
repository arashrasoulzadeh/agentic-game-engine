site_name: ZARVAN
site_description: ZARVAN, an agent-native, simulation-first game engine built with Dart — A pure-Dart 2D game engine built for AI agents and humans — ECS, platformer and turn-based strategy, content as data.
site_url: https://meetarash.ir/agentic-game-engine/
repo_url: https://github.com/arashrasoulzadeh/zarvan
repo_name: arashrasoulzadeh/zarvan
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/zarvan.css

extra_javascript:
  - javascripts/rtl.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - hooks/repo_links.py
  - hooks/llms_txt.py

exclude_docs: |
  proposals/
  studio/qa-level-editor.md

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn

