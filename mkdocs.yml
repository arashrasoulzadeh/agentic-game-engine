site_name: Agentic Game Engine
site_description: A pure-Dart 2D game engine built for AI agents and humans — ECS, platformer and turn-based strategy, content as data.
site_url: https://meetarash.ir/agentic-game-engine/
repo_url: https://github.com/arashrasoulzadeh/agentic-game-engine
repo_name: arashrasoulzadeh/agentic-game-engine
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - hooks/repo_links.py

exclude_docs: |
  proposals/
  studio/design.md
  studio/qa-level-editor.md

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn

nav:
