      - Custom turn-based AI: examples/custom-turn-ai.md
      - Fog of war: examples/fog-of-war.md
      - Move-range overlay: examples/move-range-overlay.md
      - Save & restore a turn-based game: examples/save-restore-turn-game.md
      - Enemy with patrol AI: examples/spawn-enemy-with-patrol-ai.md
      - Health bar: examples/health-bar.md
      - Custom Behavior: examples/custom-behavior.md
      - Save / load: examples/save-load.md
  - Reference:
