<text x="180" y="109" fill="#9aa3b2" text-anchor="end">grade</text><rect x="190" y="96" width="81.0" height="18" rx="2" fill="#c8a66a"/><text x="277.0" y="110" fill="#9aa3b2" font-size="11">4.96 ms (120.2 fps)</text>
