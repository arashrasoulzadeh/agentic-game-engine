<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui,sans-serif" font-size="13">
<text x="190" y="22" fill="#9aa3b2" font-size="15" font-weight="600">On a phone: frame time by preset (ms, lower is better)</text>
<text x="190" y="42" fill="#9aa3b2" font-size="12">Samsung SM-S731B, 120 Hz, profile build. Dashed lines: 120 fps and 60 fps budgets.</text>
