name: debug_apk

# End-to-end verification + a shareable build: scaffolds a fresh sample
# game via `game_agent create` (the same way a real user/agent would),
# wired to *this* pushed commit of engine_core/engine_flutter/
# engine_platformer (not the stale `v0.1.0` tag `create`'s `--ref`
# defaults to -- see CLAUDE.md's "KNOWN LIMITATION" note on why a
# consumer must pin to `main` today), then builds a debug APK from it.
#
# This repo has no sample app checked in on purpose (see CLAUDE.md) --
# `test_game/` is local-only and gitignored -- so this is the only way
# to get a real installable APK out of CI at all.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch engine_cli's own dependencies
        working-directory: packages/engine_cli
        run: dart pub get

      - name: Scaffold a sample game via game_agent create
        working-directory: packages/engine_cli
        run: |
          dart run bin/game_agent.dart create sample_game \
            --ref "${{ github.sha }}" \
            --output-dir "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/sample_game
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sample-game-debug-apk
          path: ${{ runner.temp }}/sample_game/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
