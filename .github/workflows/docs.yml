name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "packages/engine_core/lib/**"
      - "packages/engine_schema/lib/**"
      - "packages/engine_flutter/lib/**"
      - "packages/engine_platformer/lib/**"
      - "packages/engine_strategy/lib/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Build site (broken links fail the build)
        run: mkdocs build --strict

      # The Flutter SDK bundles Dart, so one setup documents every package; the
      # Flutter-dependent ones need `flutter pub get` rather than `dart pub get`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate API docs
        run: |
          for pkg in engine_schema engine_core engine_flutter engine_platformer engine_strategy; do
            (cd packages/$pkg && flutter pub get && dart doc . )
            mkdir -p site/api/$pkg
            cp -r packages/$pkg/doc/api/. site/api/$pkg/
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
