name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
      - "packages/engine_core/lib/**"
      - "packages/engine_schema/lib/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "hooks/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Build site (broken links fail the build)
        run: mkdocs build --strict

      - uses: dart-lang/setup-dart@v1

      - name: Generate API docs for the pure-Dart packages
        run: |
          for pkg in engine_schema engine_core; do
            (cd packages/$pkg && dart pub get && dart doc . )
            mkdir -p site/api/$pkg
            cp -r packages/$pkg/doc/api/. site/api/$pkg/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
