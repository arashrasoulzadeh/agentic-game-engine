name: zarvan_flutter

on:
  push:
    branches: [main]
    paths:
      - 'packages/zarvan_flutter/**'
      - '.github/workflows/zarvan_flutter.yml'
  pull_request:
    paths:
      - 'packages/zarvan_flutter/**'
      - '.github/workflows/zarvan_flutter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zarvan_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
