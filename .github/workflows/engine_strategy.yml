name: engine_strategy

on:
  push:
    branches: [main]
    paths:
      - 'packages/engine_strategy/**'
      - 'packages/engine_core/**'
      - 'packages/engine_flutter/**'
      - 'packages/engine_schema/**'
      - '.github/workflows/engine_strategy.yml'
  pull_request:
    paths:
      - 'packages/engine_strategy/**'
      - 'packages/engine_core/**'
      - 'packages/engine_flutter/**'
      - 'packages/engine_schema/**'
      - '.github/workflows/engine_strategy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine_strategy
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
