name: engine_platformer

on:
  push:
    branches: [main]
    paths:
      - 'packages/engine_platformer/**'
      - 'packages/engine_core/**'
      - 'packages/engine_flutter/**'
      - '.github/workflows/engine_platformer.yml'
  pull_request:
    paths:
      - 'packages/engine_platformer/**'
      - 'packages/engine_core/**'
      - 'packages/engine_flutter/**'
      - '.github/workflows/engine_platformer.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine_platformer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
